}
*{box-sizing:border-box}

.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}

.totals{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.tot span{font-size:12px;color:var(--muted);white-space:nowrap}
button.tot{cursor:pointer;transition:transform .12s}

.tot.all b{color:var(--sky)} .tot.go b{color:var(--yes)} .tot.par b{color:var(--par)} .tot.leave b{color:var(--leave)} .tot.blank b{color:#c98a00} .tot.skip b{color:#7a6f8f} .tot.nt b{color:#8b5cf6}

.list{background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.help{font-size:12px;color:var(--muted);margin-top:10px}

.modebar{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;margin:6px 0 4px}

.opt.clear{grid-column:1/-1;height:48px;font-size:15px;background:var(--surface);color:var(--muted);border:2px solid var(--line)}

let cur = "ALL", fs = null, auth = null, unsub = null, canWrite = false, open = null;
const $ = s => document.querySelector(s);
const stu = {}; ROSTER.forEach(c=>c.st.forEach(s=>stu[s.id]={...s,c:c.c}));
const S = id => state[id] || {};
const nameOf = s => s.zh + (s.en ? " " + s.en : "");
const filled = x => !!(x.go||x.back||x.par||x.leave||x.skip);

/* ---------- 統計 ---------- */
function stat(c){
  const r={n:c.st.length,go:0,back:0,par:0,leave:0,skip:0,blank:0,note:0};
  c.st.forEach(s=>{ const x=S(s.id);
    if(x.go)r.go++; if(x.back)r.back++; if(x.par)r.par++; if(x.leave)r.leave++; if(x.skip)r.skip++; if(!filled(x))r.blank++; if(x.note)r.note++; });
  return r;
}
const scope = () => cur==="ALL" ? ROSTER : ROSTER.filter(c=>c.c===cur);

function renderTotals(){
  const t={n:0,go:0,back:0,par:0,leave:0,skip:0,blank:0,note:0};
  scope().forEach(c=>{const s=stat(c); for(const k in t) t[k]+=s[k];});
  $("#tAll").textContent=t.n; $("#tGo").textContent=t.go; $("#tBack").textContent=t.back;
  $("#tPar").textContent=t.par; $("#tLeave").textContent=t.leave; $("#tBlank").textContent=t.blank; $("#tNote").textContent=t.note;
}
function renderChips(){
  const box=$("#chips"); box.textContent="";
  const mk=(key,label,sub,done)=>{ const b=document.createElement("button"); b.type="button"; b.className="chip"+(done?" done":"");
    b.setAttribute("aria-pressed",cur===key); const a=document.createElement("span"); a.textContent=label; const m=document.createElement("small"); m.textContent=sub;
    b.append(a,m); b.onclick=()=>{cur=key; open=null; render(); window.scrollTo({top:0});}; box.appendChild(b); };
  mk("ALL","全部",Object.keys(stu).length+"人",false);
  ROSTER.forEach(c=>{const s=stat(c); mk(c.c,c.c,`${s.n-s.blank}/${s.n}`, s.blank===0);});
}
function optBtn(s,k,label){
  const x=S(s.id), on=!!x[k], b=document.createElement("button");
  b.type="button"; b.className="t t-"+k+(on?" on":""); b.disabled=!canWrite;
  b.setAttribute("aria-pressed",on);
  const sp=document.createElement("span"); sp.textContent=label; b.appendChild(sp);
  if(k==="leave" && on){ const sm=document.createElement("small"); sm.textContent=x.reason||"寫原因"; b.appendChild(sm); }
  b.onclick=()=>{
    if(k==="leave"){ open = {id:s.id, draft:x.reason||""}; render(); focusOpen(); return; }
    const patch={[k]:!on};
    if(!on && k==="skip"){ Object.assign(patch,{go:false,back:false,par:false,leave:false,reason:""}); }
    else if(!on){ patch.skip=false; if(x.leave){ patch.leave=false; patch.reason=""; } }
    save(s.id,patch);
  };
  return b;
}
/* 未填的排在上面；點選後 2 秒才移到下面，方便同一位學生連點兩個按鈕 */
let ORDER={}, ORDER_FILLED={}, resortTimer=null;
function orderOf(c){
  if(!ORDER[c.c]){
    const a=c.st.filter(s=>!filled(S(s.id))), b=c.st.filter(s=>filled(S(s.id)));
    ORDER[c.c]=a.concat(b); ORDER_FILLED[c.c]=b.length;
  }
  return ORDER[c.c];
}
function scheduleResort(ms){
  clearTimeout(resortTimer);
  resortTimer=setTimeout(()=>{ if(open || (document.activeElement&&document.activeElement.classList.contains("note"))){ scheduleResort(1500); return; }
    ORDER={}; ORDER_FILLED={}; render(); }, ms);
}
function renderMain(){
  const main=$("#main"); main.textContent="";
  scope().forEach(c=>{
    const st=stat(c);
    const head=document.createElement("div"); head.className="classhead";
    const l=document.createElement("div"); const h=document.createElement("h2"); h.textContent=c.c; const m=document.createElement("div"); m.className="meta"; m.textContent=c.t; l.append(h,m);
    const r=document.createElement("div"); r.className="stat"; r.textContent=`搭來 ${st.go} · 搭回 ${st.back} · 家長 ${st.par} · 請假 ${st.leave} · 未填 ${st.blank} / ${st.n}`;
    head.append(l,r); main.appendChild(head);
    const box=document.createElement("div"); box.className="list";
    let shownDiv=false;
    orderOf(c).forEach(s=>{
      if(!shownDiv && filled(S(s.id)) && ORDER_FILLED[c.c]>0 && ORDER_FILLED[c.c]<c.st.length){
        const d=document.createElement("div"); d.className="divider"; d.textContent="已填寫 ↓"; box.appendChild(d); }
      if(filled(S(s.id))) shownDiv=true;
      const x=S(s.id), row=document.createElement("div"); row.className="row"+(x.leave?" is-leave":"");
      const w=document.createElement("div"); w.className="who";
      const zh=document.createElement("span"); zh.className="zh"; zh.textContent=s.zh;
      const en=document.createElement("span"); en.className="en"; en.textContent=s.en; w.append(zh,en);
      const inp=document.createElement("input"); inp.className="note"+(x.note?" has":""); inp.id="note-"+s.id; inp.dataset.id=s.id;
      inp.placeholder="備註"; inp.maxLength=40; inp.value=x.note||""; inp.setAttribute("list","noteOpts"); inp.setAttribute("aria-label",s.zh+" 備註"); inp.disabled=!canWrite;
      inp.addEventListener("change",()=>save(s.id,{note:inp.value.trim()}));
      const btns=document.createElement("div"); btns.className="btns";
      BTNS.forEach(([k,label])=>btns.appendChild(optBtn(s,k,label)));
      row.append(w,inp,btns);
      box.appendChild(row);
      if(open && open.id===s.id) box.appendChild(buildLeave(s));
    });
    main.appendChild(box);
  });
}
function renderOpts(){
  let dl=document.getElementById("noteOpts");
  if(!dl){ dl=document.createElement("datalist"); dl.id="noteOpts"; document.body.appendChild(dl); }

function render(){
  const a=document.activeElement; let keep=null;
  if(a && a.classList && a.classList.contains("note")) keep={id:a.dataset.id,v:a.value,s:a.selectionStart,e:a.selectionEnd};
  renderTotals(); renderChips(); renderMain(); renderOpts(); if(sheetKey) renderSheet(); if(examMode) renderExam(); if(bbqMode) renderBbq(); if(eqMode) renderEq();

function focusOpen(){ const el=document.querySelector(".pickrow"); if(el){ el.scrollIntoView({block:"nearest",behavior:"smooth"}); const t=el.querySelector("textarea"); if(t) t.focus(); } }
function buildLeave(s){
  const x=S(s.id), box=document.createElement("div"); box.className="pickrow";

  ["病假","事假","出國","家裡有事"].forEach(w=>{ const b=document.createElement("button"); b.type="button"; b.textContent=w;
    b.onclick=()=>{ ta.value=w+(ta.value?"："+ta.value:""); open.draft=ta.value; ta.focus(); }; q.appendChild(b); });

/* ---------- 名單面板 ---------- */
let sheetKey=null;
const SHEET={
  go:   {t:"搭來",     pick:x=>!!x.go},
  back: {t:"搭回",     pick:x=>!!x.back},
  par:  {t:"家長接送", pick:x=>!!x.par},
  leave:{t:"請假",     pick:x=>!!x.leave, tag:x=>x.reason||"未寫原因"},
  skip: {t:"不考試",   pick:x=>!!x.skip},
  blank:{t:"尚未填",   pick:x=>!filled(x)}
};
function renderSheet(){
  const body=$("#sheetBody"); body.textContent="";
  let total=0, title; SHEET_ROWS=[]; const counts=[];
  if(sheetKey==="note"){
    title="備註統計"; const g={};
    scope().forEach(c=>c.st.forEach(s=>{const n=S(s.id).note; if(n)(g[n]=g[n]||[]).push(c.c+" "+nameOf(s));}));
    Object.keys(g).sort((a,b)=>g[b].length-g[a].length).forEach(k=>{ total+=g[k].length; counts.push([k,g[k].length]); g[k].forEach(n=>SHEET_ROWS.push([k,n,"",""])); body.appendChild(grp(k,g[k])); });
  } else {
    const cfg=SHEET[sheetKey]; title=cfg.t;
    scope().forEach(c=>{
      const who=c.st.filter(s=>cfg.pick(S(s.id)));
      if(!who.length) return; total+=who.length; counts.push([c.c,who.length]);
      who.forEach(s=>{ const x=S(s.id); SHEET_ROWS.push([c.c,s.zh,s.en,[cfg.tag?cfg.tag(x):"", sheetKey!=="leave"?x.note:""].filter(Boolean).join("，")]); });
      body.appendChild(grp(c.c, who.map(s=>{ const x=S(s.id); const tg=[cfg.tag?cfg.tag(x):"", sheetKey!=="leave"?x.note:""].filter(Boolean).join("，");
        return nameOf(s)+(tg?"（"+tg+"）":""); })));
    });
  }
  if(!total){ const e=document.createElement("p"); e.className="empty"; e.textContent="目前沒有學生"; body.appendChild(e); }
  const h=$("#sheetTitle"); h.textContent=title+(cur!=="ALL"?" · "+cur:"");
  const sp=document.createElement("span"); sp.textContent="共 "+total+" 人"; h.appendChild(sp);
  SHEET_TITLE=title; SHEET_TOTAL=total; SHEET_COUNTS=counts;
  const sum=$("#sheetSum"); sum.textContent="";
  counts.forEach(([k,n])=>{ const e=document.createElement("span"); const b=document.createElement("b"); b.textContent=k; e.append(b," "+n+" 人"); sum.appendChild(e); });
}
let SHEET_ROWS=[], SHEET_TITLE="", SHEET_TOTAL=0, SHEET_COUNTS=[];
function sheetText(){
  const lines=["11/7 模擬考 "+SHEET_TITLE+"：共 "+SHEET_TOTAL+" 人"];
  SHEET_COUNTS.forEach(([k,n])=>{ const names=SHEET_ROWS.filter(r=>r[0]===k).map(r=>(r[1]+(r[2]?" "+r[2]:""))+(r[3]?"（"+r[3]+"）":""));
    lines.push(k+"（"+n+" 人）："+names.join("、")); });

}

function el(tag,cls,txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
let examMark="board";
const ST_LABEL = { leave:"請假", self:{go:"自行前往", back:"自行回家"} };
const stOf = (k,trip=examTrip) => exState(k)[trip+"St"] || "";
const stText = (st,trip=examTrip) => st==="leave" ? "請假" : st==="self" ? ST_LABEL.self[trip] : "";
function busKeys(i){ const b=EXAM.buses[i]; return [...b.cls.flatMap(cc=>exKids(cc).map(s=>({k:s.id,name:s.zh,sub:s.c}))), ...b.t.map((n,j)=>({k:`t${i+1}_${j}`,name:n,sub:"老師"}))]; }
function busStat(i,trip=examTrip){
  const ks=busKeys(i), r={all:ks.length,on:0,leave:[],self:[],miss:[]};
  ks.forEach(x=>{ const st=stOf(x.k,trip); if(st==="leave") r.leave.push(x); else if(st==="self") r.self.push(x); else if(exState(x.k)[trip]) r.on++; else r.miss.push(x); });
  r.need=r.all-r.leave.length-r.self.length; return r;
}
function tapKid(key){
  const x=exState(key), T=examTrip, st=x[T+"St"]||"";
  if(examMark==="board"){ if(st) save(EXAM.key+key,{[T+"St"]:"",[T]:true}); else save(EXAM.key+key,{[T]:!x[T]}); return; }
  if(examMark==="leave"){
    if(st==="leave"){ const p={[T+"St"]:""}; if(T==="go" && x.backSt==="leave") p.backSt=""; save(EXAM.key+key,p); }
    else { const p={[T+"St"]:"leave",[T]:false}; if(T==="go"){ p.backSt="leave"; p.back=false; } save(EXAM.key+key,p); }
    return; }
  if(examMark==="self"){ save(EXAM.key+key, st==="self" ? {[T+"St"]:""} : {[T+"St"]:"self",[T]:false}); }
}
function kidBtn(key,zh,en,isT){

  const b=el("button","kid"+(on?" on":"")+(st?" st-"+st:"")+(isT?" tch":""));

  b.append(el("span","zh",zh), el("span","en",en||""));
  if(st) b.dataset.tag=stText(st); 
  b.onclick=()=>tapKid(key);

}
function examReport(){
  const T=examTrip, lines=[`11/15 英檢 ${T==="go"?"去程":"回程"}點名`];
  EXAM.buses.forEach((b,i)=>{ const r=busStat(i);
    lines.push(`【${b.n}】已上車 ${r.on} / 應搭 ${r.need} 人`);
    if(r.miss.length) lines.push(r.miss.length>15 ? `　還沒上車 ${r.miss.length} 人` : `　還沒上車：${r.miss.map(x=>x.name).join("、")}`);
    if(r.leave.length) lines.push(`　請假：${r.leave.map(x=>x.name+(exState(x.k).why?"（"+exState(x.k).why+"）":"")).join("、")}`);
    if(r.self.length) lines.push(`　${ST_LABEL.self[T]}：${r.self.map(x=>x.name+(exState(x.k).why?"（"+exState(x.k).why+"）":"")).join("、")}`);
  });
  return lines.join("\n");
}

/* ---------- 烤肉分組（高年級配低年級，一桌 10 人，可拖拉調換） ---------- */
const BBQ = { key:"bbq_", size:10 };
let bbqMode=false, bbqSel=null;
const CLS_ORDER = ROSTER.map(c=>c.c);
/* 烤肉：不參加的人不算；自行前往的人也要一起烤肉 */
const isSkip = id => /不參加/.test(EXAM.out[id]||"");
const bbqKids = () => ROSTER.flatMap(c=>c.st.filter(s=>!isSkip(s.id)).map(s=>({...s,c:c.c})));
const BBQ_N = Math.ceil(bbqKids().length / BBQ.size);
/* 自動分組：同班盡量坐一起。低年級班（K2、H2 級）由小到大排、高年級班（H3 級以上）由大到小排，
   各切成 BBQ_N 段連續的人，第 i 段低年級配第 i 段高年級 → 每桌大多只有 1～2 個班，而且高低年級都有 */
const LOW_CLS = ["H1","H1A","H1B","H2A","H2B","H3"];
const BBQ_AUTO = (()=>{
  const kids=bbqKids(), byCls=c=>kids.filter(s=>s.c===c);
  const low=LOW_CLS.flatMap(byCls), high=CLS_ORDER.filter(c=>!LOW_CLS.includes(c)).reverse().flatMap(byCls);
  const N=BBQ_N, size=(len,i)=>Math.floor(len/N)+(i<len%N?1:0);
  // 高年級多的段配低年級少的段，讓每桌接近 10 人
  const lowSizes=[...Array(N)].map((_,i)=>size(low.length,i)).sort((a,b)=>b-a);
  const highSizes=[...Array(N)].map((_,i)=>size(high.length,i)).sort((a,b)=>a-b);
  const m={}; let li=0, hi=0;
  for(let i=0;i<N;i++){
    for(let j=0;j<lowSizes[i];j++) m[low[li++].id]=i;
    for(let j=0;j<highSizes[i];j++) m[high[hi++].id]=i;
  }
  return m;
})();
const bbqTable = id => { const v=(state[BBQ.key+id]||{}).tb; return Number.isInteger(v) ? v : BBQ_AUTO[id]; };
const band = g => g>=5 ? "hi" : g>=3 ? "mid" : "lo";
function bbqMove(id, tb){ if(bbqTable(id)!==tb) save(BBQ.key+id,{tb}); }
function bbqSwap(a,b){ const ta=bbqTable(a), tb=bbqTable(b); if(ta===tb) return; save(BBQ.key+a,{tb:tb}); save(BBQ.key+b,{tb:ta}); }
function renderBbq(){
  const box=$("#bbq"); box.textContent="";
  const kids=bbqKids();
  box.append(el("h2","ex-title","烤肉分組"));
  box.append(el("div","ex-sub",`共 ${kids.length} 位學生，${BBQ_N} 桌，每桌約 ${BBQ.size} 人。高年級和低年級混在一起。`));
  const help=el("div","bbq-help");
  help.append(el("b",null,"怎麼調換："), "電腦用滑鼠把小朋友拖到另一位小朋友身上＝兩人交換；拖到別桌的空白處＝移過去。手機／平板：先點一位小朋友（會變黃色），再點另一位＝交換；或點別桌的「移到這桌」。");
  const tools=el("div","bbq-tools");
  const legend=el("div","bbq-legend"); legend.append(el("span","k hi","5–6 年級"), el("span","k mid","3–4 年級"), el("span","k lo","2 年級"));
  const cp=el("button","btn ghost sm","複製分組文字"); cp.type="button";
  const dl=el("button","btn sm","下載分組名單"); dl.type="button";
  const rs=el("button","btn ghost sm","恢復自動分組"); rs.type="button";
  tools.append(legend, cp, dl, rs);
  box.append(help, tools);
  const tables=[...Array(BBQ_N)].map(()=>[]);
  kids.forEach(s=>{ const t=bbqTable(s.id); (tables[t]||tables[0]).push(s); });
  tables.forEach(list=>list.sort((a,b)=>(b.g||0)-(a.g||0) || CLS_ORDER.indexOf(a.c)-CLS_ORDER.indexOf(b.c)));
  const grid=el("div","bbq-grid");
  tables.forEach((list,i)=>{
    const card=el("section","bbq-table"); card.dataset.tb=i;
    const h=el("div","bbq-head"); h.append(el("b",null,`第 ${i+1} 桌`));
    const cnt={hi:0,mid:0,lo:0}; list.forEach(s=>cnt[band(s.g)]++);
    h.append(el("span","bbq-cnt"+(list.length>BBQ.size?" over":""),`${list.length} 人`));
    const sub=el("div","bbq-sub",`高 ${cnt.hi}・中 ${cnt.mid}・低 ${cnt.lo}`);
    const ul=el("div","bbq-list");
    list.forEach(s=>{
      const k=el("button","bk "+band(s.g)+(bbqSel===s.id?" sel":"")); k.type="button"; k.dataset.id=s.id; k.disabled=!canWrite;

      if(EXAM.out[s.id]) k.classList.add("bk-self");
      ul.append(k);
    });
    const mv=el("button","bbq-move","移到這桌"); mv.type="button"; mv.hidden=!bbqSel || bbqTable(bbqSel)===i;
    mv.onclick=()=>{ const id=bbqSel; bbqSel=null; bbqMove(id,i); render(); };
    card.append(h,sub,ul,mv); grid.append(card);
  });
  box.append(grid);
  const text=()=>["烤肉分組（共 "+kids.length+" 人）",...tables.map((l,i)=>`第 ${i+1} 桌（${l.length} 人）：`+l.map(s=>`${s.zh}(${s.c})`).join("、"))].join("\n");
  cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(text()); cp.textContent="已複製 ✓"; }catch(_){ const ta=document.createElement("textarea"); ta.value=text(); document.body.append(ta); ta.select(); try{document.execCommand("copy"); cp.textContent="已複製 ✓";}catch(__){} ta.remove(); } setTimeout(()=>cp.textContent="複製分組文字",1800); };
  dl.onclick=()=>{ const rows=[["桌次","班級","姓名","英文名","年級"]]; tables.forEach((l,i)=>l.forEach(s=>rows.push([`第 ${i+1} 桌`,s.c,s.zh,s.en,s.g||""]))); dlCsv(rows,"烤肉分組名單.csv"); };
  let armed=false;
  rs.onclick=()=>{ if(!armed){ armed=true; rs.textContent="再按一次確定恢復"; setTimeout(()=>{armed=false; rs.textContent="恢復自動分組";},3000); return; }
    kids.forEach(s=>{ if(Number.isInteger((state[BBQ.key+s.id]||{}).tb)) save(BBQ.key+s.id,{tb:null}); }); bbqSel=null; };
}
/* 拖拉（滑鼠）＋點選（觸控） */
(function(){
  let drag=null;
  document.addEventListener("pointerdown",e=>{
    const k=e.target.closest && e.target.closest(".bk"); if(!k || k.disabled || !bbqMode) return;
    if(e.pointerType!=="mouse") return;
    drag={id:k.dataset.id, x:e.clientX, y:e.clientY, el:k, ghost:null};
  });
  document.addEventListener("pointermove",e=>{
    if(!drag) return;
    if(!drag.ghost){ if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6) return;
      drag.ghost=drag.el.cloneNode(true); drag.ghost.classList.add("ghost"); document.body.append(drag.ghost); drag.el.classList.add("dragging"); }
    drag.ghost.style.left=(e.clientX+8)+"px"; drag.ghost.style.top=(e.clientY+8)+"px";
    document.querySelectorAll(".bbq-table.drop,.bk.drop").forEach(x=>x.classList.remove("drop"));
    const t=document.elementFromPoint(e.clientX,e.clientY); const kk=t&&t.closest(".bk"); const tb=t&&t.closest(".bbq-table");
    if(kk && kk.dataset.id!==drag.id) kk.classList.add("drop"); else if(tb) tb.classList.add("drop");
  });
  document.addEventListener("pointerup",e=>{
    if(!drag) return; const d=drag; drag=null;
    document.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"));
    if(!d.ghost) return;  // 沒有拖動＝當作點選，交給 click
    d.ghost.remove(); d.el.classList.remove("dragging"); d.el.dataset.dragged="1";
    const t=document.elementFromPoint(e.clientX,e.clientY); const kk=t&&t.closest(".bk"); const tb=t&&t.closest(".bbq-table");
    bbqSel=null;
    if(kk && kk.dataset.id!==d.id) bbqSwap(d.id,kk.dataset.id);
    else if(tb) bbqMove(d.id,+tb.dataset.tb);
    else render();
  });
  document.addEventListener("click",e=>{
    const k=e.target.closest && e.target.closest(".bk"); if(!k || !bbqMode || k.disabled) return;
    if(k.dataset.dragged){ delete k.dataset.dragged; return; }
    const id=k.dataset.id;
    if(!bbqSel){ bbqSel=id; render(); return; }
    if(bbqSel===id){ bbqSel=null; render(); return; }
    const a=bbqSel; bbqSel=null; bbqSwap(a,id); render();
  });
})();

  const ng={}; ROSTER.forEach(c=>c.st.forEach(s=>{const n=S(s.id).note; if(n)(ng[n]=ng[n]||[]).push(c.c+" "+s.zh);}));
  rows.push([]); rows.push(["備註統計","人數","名單"]); Object.keys(ng).forEach(k=>rows.push([k,ng[k].length,ng[k].join("、")]));
  dlCsv(rows,"11-7模擬考搭車統計.csv");
};
function dlCsv(rows,name){
  const csv="﻿"+rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=name; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- 登入與同步 ---------- */
function start(){
  $("#gate").hidden=true; $("#app").hidden=false; canWrite=true; render();
  if(unsub) unsub();
  const timer=setTimeout(()=>setStatus("連不上資料庫，請檢查網路"),10000);
  let firstSnap=true;
  unsub=fs.collection(COL).onSnapshot(snap=>{
    clearTimeout(timer);
    snap.docChanges().forEach(ch=>{ if(ch.type==="removed") delete state[ch.doc.id]; else state[ch.doc.id]=ch.doc.data(); });
    setStatus(snap.metadata.hasPendingWrites?"儲存中…":"已同步 · 即時更新");
    if(firstSnap){ firstSnap=false; ORDER={}; ORDER_FILLED={}; } else scheduleResort(2000);
    render();
  }, err=>{ clearTimeout(timer);
    if(err.code==="permission-denied"){ setStatus("沒有讀取權限"); $("#app").hidden=true; $("#gate").hidden=false;
      $("#gateMsg").textContent="這個帳號還沒有權限。請確認 Firebase 資料庫規則已加入這個 Email："+((auth.currentUser&&auth.currentUser.email)||""); }
    else setStatus("同步中斷，請重新整理"); });
}
if(window.firebase && window.FIREBASE_CONFIG.apiKey){
  firebase.initializeApp(window.FIREBASE_CONFIG); fs=firebase.firestore(); auth=firebase.auth();
  $("#login").onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err=>{
    if(err.code==="auth/popup-blocked"||err.code==="auth/operation-not-supported-in-this-environment") auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    else if(err.code!=="auth/popup-closed-by-user"&&err.code!=="auth/cancelled-popup-request") $("#gateMsg").textContent="登入失敗："+err.message; });
  $("#logout").onclick=()=>auth.signOut();
  auth.onAuthStateChanged(u=>{
    if(u){ $("#who").textContent=u.email; $("#logout").hidden=false; start(); }
    else { if(unsub){unsub();unsub=null;} $("#who").textContent=""; $("#logout").hidden=true; $("#app").hidden=true; $("#gate").hidden=false; setStatus("尚未登入"); }
  });
} else {
  setStatus("離線預覽（未連資料庫）"); $("#gate").hidden=true; $("#app").hidden=false; canWrite=true; render();
}
</script>
